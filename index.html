<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface2:#f1f0ec; --ink:#0b0b0b; --ink2:#52514e; --muted:#7c7a74;
  --line:#e1e0d9; --border:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#1c5cab;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --info:#2a78d6;
  --good-bg:#e6f4e6; --warn-bg:#fff3d6; --crit-bg:#fbe7e7; --info-bg:#e6f0fc;
  --good-ink:#006300; --warn-ink:#7a4f00; --crit-ink:#a92b2b; --info-ink:#1c5cab;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.10);
  --sheet:48vh;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface2:#242422; --ink:#ffffff; --ink2:#c3c2b7; --muted:#9a988f;
    --line:#2c2c2a; --border:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
    --good-bg:#14301a; --warn-bg:#382a0c; --crit-bg:#3d1818; --info-bg:#132a47;
    --good-ink:#5fd35f; --warn-ink:#fab219; --crit-ink:#f08a8a; --info-ink:#86b6ef;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface2:#242422; --ink:#ffffff; --ink2:#c3c2b7; --muted:#9a988f;
  --line:#2c2c2a; --border:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
  --good-bg:#14301a; --warn-bg:#382a0c; --crit-bg:#3d1818; --info-bg:#132a47;
  --good-ink:#5fd35f; --warn-ink:#fab219; --crit-ink:#f08a8a; --info-ink:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:400px 1fr;height:100vh;height:100dvh}
#panel{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--border);z-index:1000}
#mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--surface2)}
.handle{display:none}
.p-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 16px 10px}
.p-head h1{font-size:18px}
.p-head .sub{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 9px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px}
.p-body{flex:1;min-height:0;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.p-body h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:20px 0 8px;font-weight:650}

/* ---------- summary ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface2);border-radius:10px;padding:10px 10px 9px}
.kpi .kv{font-size:24px;font-weight:700;line-height:1.1}
.kpi .kl{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi small{color:var(--muted);font-size:11px}
.note{color:var(--ink2);font-size:12.5px;margin:10px 0 0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer}
.stat3 button:hover{background:var(--surface2)}
.stat3 .n{display:block;font-size:22px;font-weight:700;line-height:1.15;margin-top:4px}
.klist{list-style:none;margin:0;padding:0}
.klist>li{border-bottom:1px solid var(--line)}
.krow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;background:none;border:0;padding:10px 2px;text-align:left;cursor:pointer;align-items:center}
.krow:hover .kname{color:var(--accent-ink)}
.kname{font-weight:650}
.kname .chev{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.krow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.kcount{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.kcount small{font-weight:500;color:var(--ink2)}
.kbar{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track>span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.kmeta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.dsub{list-style:none;margin:0 0 10px;padding:0 0 0 14px}
.dsub button{display:flex;width:100%;justify-content:space-between;gap:8px;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}
.dsub button:hover{background:var(--surface2)}
.dsub .dn small{color:var(--muted);margin-left:4px}
.dsub .dc{font-variant-numeric:tabular-nums;font-weight:650;display:flex;gap:6px;align-items:center}

/* ---------- status badges ---------- */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px 1px 2px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px}
.st i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10.5px;font-weight:800;color:#fff;line-height:1}
.st-good{background:var(--good-bg);color:var(--good-ink)} .st-good i{background:var(--good)}
.st-warn{background:var(--warn-bg);color:var(--warn-ink)} .st-warn i{background:var(--warn);color:#3a2600}
.st-crit{background:var(--crit-bg);color:var(--crit-ink)} .st-crit i{background:var(--crit)}
.st-info{background:var(--info-bg);color:var(--info-ink)} .st-info i{background:var(--info)}
.st.ic{padding:1px;background:none}

/* ---------- validation ---------- */
.lead{margin:0 0 10px;color:var(--ink2);font-size:13px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.fchips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.vcard{border:1px solid var(--border);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--surface)}
.vcard.b-crit{border-left-color:var(--crit)} .vcard.b-warn{border-left-color:var(--warn)} .vcard.b-good{border-left-color:var(--good)}
.vcard h3{font-size:15px;margin:4px 0 0}
.vcard .meta{color:var(--ink2);font-size:12px}
.idrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px;margin-top:6px}
.idl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.id{font-family:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.id .g-kab,.id .g-kec,.id .g-dd,.id .g-urut{margin-left:.38em}
.bad-crit{background:var(--crit-bg);color:var(--crit-ink);box-shadow:inset 0 -2px var(--crit);border-radius:3px;font-weight:700}
.bad-warn{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 -2px var(--warn);border-radius:3px;font-weight:700}
.notes{list-style:none;margin:8px 0 0;padding:0}
.notes li{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13px;margin:4px 0}
.notes li .st{padding:0;background:none}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
details.rules{border:1px solid var(--border);border-radius:10px;padding:0 12px;margin-bottom:12px;background:var(--surface2)}
details.rules summary{cursor:pointer;padding:10px 0;font-weight:650}
details.rules[open]{padding-bottom:12px}
.diag{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.diag div{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px;text-align:center}
.diag b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.diag span{font-size:10.5px;color:var(--ink2)}
.rules ul{margin:6px 0;padding-left:18px} .rules li{margin:3px 0;font-size:13px}
.rules p{margin:8px 0 2px;font-size:13px}

/* ---------- data list ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1/-1}
.filters input,.filters select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
@media (min-width:900px){.filters input,.filters select{font-size:14px}}
.count{color:var(--ink2);font-size:12px;margin:10px 0 4px}
.rlist{list-style:none;margin:0;padding:0}
.rlist button{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;text-align:left;cursor:pointer}
.rlist button:hover{background:var(--surface2)}
.rlist .nm{font-weight:600}
.rlist .sub2{grid-column:2;color:var(--ink2);font-size:12px;display:flex;flex-wrap:wrap;gap:2px 10px}
.rlist .id{font-size:12px}

/* ---------- map ui ---------- */
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.seg{display:flex;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--surface)}
.ctl-stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.legend{padding:8px 10px;font-size:12px;min-width:150px}
.legend .lt{font-weight:650;margin-bottom:5px}
.legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;font-variant-numeric:tabular-nums}
.legend .sw{width:16px;height:12px;border-radius:3px;border:1px solid var(--border)}
.legend .sw.zero{background:transparent;border:1px dashed var(--muted)}
.legend .lfoot{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.leaflet-container{font:inherit}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface);color:var(--ink);border-bottom-color:var(--line);width:36px;height:36px;line-height:36px;font-size:20px}
.leaflet-bar{border:1px solid var(--border)!important;box-shadow:var(--shadow)!important;border-radius:10px!important;overflow:hidden}
.viewbtns{display:flex;flex-direction:column}
.viewbtns button{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:650;padding:7px 8px;cursor:pointer;min-width:36px}
.viewbtns button:last-child{border-bottom:0}
.viewbtns button:hover{background:var(--surface2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink2)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.4}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink2);width:28px;height:28px;font-size:20px}
.leaflet-tooltip.tip{background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:5px 8px;font-size:12.5px}
.leaflet-tooltip.tip:before{display:none}
.pop .pk{font-size:11.5px;color:var(--ink2)}
.pop .pt{font-size:16px;font-weight:700;margin:1px 28px 2px 0}
.pop .pn{font-size:13px} .pop .pn b{font-size:18px}
.pop .pst{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.pop .pe{color:var(--ink2);margin:6px 0 0}
.pop ul{list-style:none;margin:6px 0 0;padding:6px 0 0;border-top:1px solid var(--line);max-height:190px;overflow:auto}
.pop li button{display:flex;gap:6px;align-items:center;width:100%;background:none;border:0;border-radius:6px;padding:4px;text-align:left;cursor:pointer;font-size:13px}
.pop li button:hover{background:var(--surface2)}
.pop .hint{font-size:11px;color:var(--muted);margin-top:4px}

/* markers */
.lbl{background:none;border:0}
.lbl>div{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.klabel{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:3px 9px 4px;box-shadow:var(--shadow);text-align:center;white-space:nowrap;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.2}
.klabel b{display:block;font-size:15px;font-weight:750}
.klabel small{font-weight:500;color:var(--ink2)}
.cnt{width:var(--d);height:var(--d);border-radius:50%;background:var(--surface);color:var(--ink);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:750;box-shadow:var(--shadow);cursor:pointer}
.cnt .flag{position:absolute;top:-6px;right:-7px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--crit);border:1.5px solid var(--surface)}
.cnt .flag.warn{background:var(--warn);color:#3a2600}
.cnt.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.dname{position:absolute;top:100%;left:50%;transform:translate(-50%,3px);white-space:nowrap;font-size:11px;font-weight:650;color:var(--ink);pointer-events:none;
  text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface)}
.z-lo .dname{display:none}
.z-xs .lbl>.cnt{transform:translate(-50%,-50%) scale(.68)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
#modal[hidden]{display:none}
.mcard{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(540px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px 18px 16px;position:relative}
.mcard .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);font-size:18px;cursor:pointer}
.mcard .mk{color:var(--ink2);font-size:12px}
.mcard h3{font-size:19px;margin:2px 40px 6px 0}
.mcard dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:12px 0 0;font-size:13.5px}
.mcard dt{color:var(--ink2)}
.mcard dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mcard .sec{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}

/* ---------- sumber & progres ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--border);background:var(--surface2);color:var(--ink2);border-radius:5px;padding:0 5px;line-height:16px;margin-left:6px;vertical-align:1px;white-space:nowrap;font-style:normal}
.tag.sk{background:var(--info-bg);color:var(--info-ink);border-color:transparent}
.filters #fsrc{grid-column:1/-1}
.sbar{display:flex;flex:1;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.sbar>span{display:block;height:100%}
.sbar .s1,.pleg .s1{background:var(--good)} .sbar .s2,.pleg .s2{background:var(--warn)} .sbar .s3,.pleg .s3{background:var(--crit)} .pleg .s0{background:var(--line)}
.sbar.big{height:14px;border-radius:7px;margin:12px 0 6px}
.pleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.pleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kbar .pp{font-size:11.5px;color:var(--ink2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.kmeta.pm>span+span:before{content:"· ";color:var(--muted)}
.krow.static{cursor:default} .krow.static:hover .kname{color:inherit}
.plist{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)} .plist li{margin:5px 0}
.pcard{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.pcard:hover{background:var(--surface2)}
.pcard .pt1{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.pcard .pt1 b{font-size:18px}
.pcard .go{color:var(--accent-ink);font-weight:600;font-size:12.5px;white-space:nowrap}
.pcard .sbar{margin:8px 0 6px}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:899px){
  #app{display:block}
  body[data-sheet="min"]{--sheet:150px}
  body[data-sheet="half"]{--sheet:46vh}
  body[data-sheet="full"]{--sheet:86vh}
  @supports (height:1dvh){
    body[data-sheet="half"]{--sheet:46dvh}
    body[data-sheet="full"]{--sheet:86dvh}
  }
  #mapwrap{position:fixed;left:0;right:0;top:0;bottom:calc(var(--sheet) - 14px)}
  #panel{position:fixed;left:0;right:0;bottom:0;height:var(--sheet);border-right:0;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);transition:height .25s ease}
  .handle{display:flex;justify-content:center;align-items:center;gap:8px;height:26px;border:0;background:none;width:100%;cursor:pointer;touch-action:none;flex:none;color:var(--muted);font-size:11px}
  .handle span{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .p-head{padding:0 16px 8px;touch-action:none}
  .p-head h1{font-size:16.5px}
  .p-body{padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
  .legend{min-width:0;padding:6px 8px;font-size:11px}
  .legend .lt{margin-bottom:3px}
  .legend .lrows{display:flex;gap:6px}
  .legend .row{flex-direction:column;gap:2px;margin:0;align-items:center}
  .legend .sw{width:22px;height:10px}
  .legend .lz{display:none}
  .legend .lfoot{margin-top:4px;padding-top:4px}
  .leaflet-bottom.leaflet-left .legend{margin-bottom:24px}
  .klabel{font-size:10.5px;padding:2px 7px 3px} .klabel b{font-size:13px}
  .seg button{padding:6px 8px;font-size:12px}
  .mcard{align-self:end}
  #modal{place-items:end center;padding:8px}
  .mcard dl{grid-template-columns:110px 1fr}
}
@media (max-width:380px){ .kpi .kv{font-size:20px} .p-head .chip{padding:4px 8px} }
</style>
</head>
<body data-sheet="half">
<div id="app">
  <aside id="panel" aria-label="Panel informasi">
    <button class="handle" id="handle" aria-label="Ubah ukuran panel"><span></span></button>
    <header class="p-head" id="phead">
      <div>
        <h1>Peta BNBA Kab. Nagekeo</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <button class="chip" id="maskBtn" aria-pressed="false" title="Samarkan tanggal pada NIK/KK (untuk berbagi layar)">Samarkan NIK</button>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" id="t-ringkasan" aria-controls="tab-ringkasan" aria-selected="true">Ringkasan</button>
      <button role="tab" id="t-progres" aria-controls="tab-progres" aria-selected="false">Progres</button>
      <button role="tab" id="t-validasi" aria-controls="tab-validasi" aria-selected="false" title="Validasi NIK & No. KK">Validasi<span class="tab-badge" id="vbadge"></span></button>
      <button role="tab" id="t-data" aria-controls="tab-data" aria-selected="false">Daftar Data</button>
    </nav>
    <div class="p-body" id="pbody">
      <section id="tab-ringkasan" role="tabpanel"></section>
      <section id="tab-progres" role="tabpanel" hidden></section>
      <section id="tab-validasi" role="tabpanel" hidden></section>
      <section id="tab-data" role="tabpanel" hidden>
        <div class="filters">
          <input type="search" id="q" placeholder="Cari nama, NIK, No. KK, atau desa…" aria-label="Cari data">
          <select id="fkec" aria-label="Filter kecamatan"></select>
          <select id="fst" aria-label="Filter status">
            <option value="">Semua status</option>
            <option value="invalid">Tidak valid</option>
            <option value="cek">Perlu dicek</option>
            <option value="valid">Valid</option>
          </select>
          <select id="fsrc" aria-label="Filter sumber data">
            <option value="">Semua sumber (SK 389 + SK 421)</option>
            <option value="bnba">SK 389/2026 – rusak berat (BNBA)</option>
            <option value="sk">SK 421/2026 – Nangadhero (KNMP)</option>
          </select>
        </div>
        <div class="count" id="dcount"></div>
        <ul class="rlist" id="rlist"></ul>
      </section>
    </div>
  </aside>
  <main id="mapwrap"><div id="map" role="application" aria-label="Peta interaktif Kabupaten Nagekeo"></div></main>
</div>
<div id="modal" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mtitle" id="mcard"></div></div>

<script>
(function(){
'use strict';
const D = DATA, KEC = D.kec, DESA = D.desa, ROWS = D.rows;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('id-ID');

const ST = {
  valid:   {label:'Valid',       icon:'✓', cls:'good'},
  cek:     {label:'Perlu dicek', icon:'!', cls:'warn'},
  invalid: {label:'Tidak valid', icon:'✕', cls:'crit'},
  info:    {label:'Info',        icon:'i', cls:'info'},
};
const badge = (st, text) => `<span class="st st-${ST[st].cls}"><i aria-hidden="true">${ST[st].icon}</i>${text == null ? ST[st].label : text}</span>`;
const icon = st => `<span class="st ic st-${ST[st].cls}" title="${ST[st].label}"><i aria-hidden="true">${ST[st].icon}</i><span class="sr">${ST[st].label}</span></span>`;
const ORDER = {invalid:0, cek:1, valid:2};

const rowByNo = new Map(ROWS.map(r => [r.no, r]));
const byDesa = new Map();
ROWS.forEach(r => { if (!byDesa.has(r.desa_code)) byDesa.set(r.desa_code, []); byDesa.get(r.desa_code).push(r); });
const desaByCode = new Map(DESA.map(d => [d.code, d]));
const kecByCode = new Map(KEC.map(k => [k.code, k]));
const issues = ROWS.filter(r => r.st !== 'valid');
const hasInfo = r => r.nik_notes.some(n => n.lvl === 'info') || r.kk_notes.some(n => n.lvl === 'info');
const S = D.meta.summary;
const SRC = D.meta.sources;
const srcTag = r => r.src === 'sk' ? `<span class="tag sk" title="${esc(SRC.sk.label)}${r.sk_no ? ', lampiran No. ' + r.sk_no : ''}">${esc(SRC.sk.short)}</span>` : '';
const PG = D.progres;
const ptot = x => x.p100 + x.p50 + x.plt50;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const progByKec = new Map(PG.kec.map(k => [k.code, k]));
const PT = PG.kec.reduce((a, k) => ({p100:a.p100 + k.p100, p50:a.p50 + k.p50, plt50:a.plt50 + k.plt50}), {p100:0, p50:0, plt50:0});
function sbar(x, base, big){
  const w = v => (base ? Math.min(100, v / base * 100) : 0).toFixed(2) + '%';
  return `<span class="sbar${big ? ' big' : ''}" role="img" aria-label="${x.p100} selesai, ${x.p50} di atas 50%, ${x.plt50} di bawah 50%, ${Math.max(0, base - ptot(x))} belum ada progres">` +
    `<span class="s1" style="width:${w(x.p100)}"></span><span class="s2" style="width:${w(x.p50)}"></span><span class="s3" style="width:${w(x.plt50)}"></span></span>`;
}
const pmeta = (x, base) => `<span>${nf(x.p100)} selesai</span><span>${nf(x.p50)} &gt;50%</span><span>${nf(x.plt50)} &lt;50%</span>` +
  (base != null ? `<span>${nf(Math.max(0, base - ptot(x)))} belum</span>` : '');

const state = {level:null, base:'peta', masked:false, sheet:'half', tab:'ringkasan', vf:'issues', openKec:null, sel:null};
const mqMobile = matchMedia('(max-width: 899px)');
const mqDark = matchMedia('(prefers-color-scheme: dark)');
const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : mqDark.matches; };

/* ================= NIK / KK rendering ================= */
const SEG = [['prov',0,2],['kab',2,4],['kec',4,6],['dd',6,8],['mm',8,10],['yy',10,12],['urut',12,16]];
function idHTML(id, notes){
  if (!/^\d{16}$/.test(id)) return `<code class="id bad-crit">${esc(id) || '(kosong)'}</code>`;
  const mark = {};
  notes.forEach(n => {
    if (n.lvl === 'info' || !n.seg) return;
    const cls = n.lvl === 'invalid' ? 'crit' : 'warn';
    const segs = n.seg === 'tgl' ? ['dd','mm','yy'] : n.seg === 'wil' ? ['prov','kab'] : [n.seg];
    segs.forEach(s => { if (mark[s] !== 'crit') mark[s] = cls; });
  });
  return '<code class="id">' + SEG.map(([k,a,b]) => {
    let t = id.slice(a, b);
    if (state.masked && (k === 'dd' || k === 'mm' || k === 'yy')) t = '••';
    return `<span class="g g-${k}${mark[k] ? ' bad-' + mark[k] : ''}">${t}</span>`;
  }).join('') + '</code>';
}
function notesHTML(r, onlyProblems){
  const all = [
    ...r.nik_notes.map(n => ({...n, w:'NIK'})),
    ...r.kk_notes.map(n => ({...n, w:'KK'})),
    ...r.data_notes.map(n => ({...n, w:'Data'})),
  ].filter(n => !onlyProblems || n.lvl !== 'info');
  if (!all.length) return '';
  all.sort((a, b) => (ORDER[a.lvl] ?? 3) - (ORDER[b.lvl] ?? 3));
  return '<ul class="notes">' + all.map(n => `<li>${icon(n.lvl)}<span><b>${n.w}:</b> ${esc(n.msg)}</span></li>`).join('') + '</ul>';
}

/* ================= panel: ringkasan ================= */
const desaWithData = DESA.filter(d => d.count > 0).length;
$('#subtitle').textContent = `Nusa Tenggara Timur · ${nf(S.count)} orang · ${KEC.length} kecamatan · ${desaWithData} desa/kel.`;
$('#vbadge').textContent = issues.length;

function renderRingkasan(){
  const max = Math.max(...KEC.map(k => k.count));
  const kecs = [...KEC].sort((a, b) => b.count - a.count);
  const rusak = Object.entries(D.meta.kerusakan).map(([k, v]) => `${esc(k)} (${nf(v)})`).join(', ');
  $('#tab-ringkasan').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kv">${nf(S.count)}</div><div class="kl">orang terdata</div></div>
      <div class="kpi"><div class="kv">${KEC.length}</div><div class="kl">kecamatan</div></div>
      <div class="kpi"><div class="kv">${desaWithData}</div><div class="kl">desa/kelurahan <small>dari ${DESA.length}</small></div></div>
    </div>
    <p class="note">Sumber data: ${nf(SRC.bnba.count)} dari ${esc(SRC.bnba.label)} (isinya sama dengan BNBA hasil validasi) + ${nf(SRC.sk.count)} dari ${esc(SRC.sk.label)} (Desa Nangadhero, Kec. Aesesa). Kategori: ${rusak}. Jenis kelamin (dibaca dari NIK): laki-laki ${nf(S.L)}, perempuan ${nf(S.P)}.</p>
    <h2>Progres pembangunan Huntara</h2>
    <button class="pcard" data-tab="progres">
      <span class="pt1"><span><b>${nf(ptot(PT))}</b> dari ${nf(S.count)} unit masuk progres · <b style="color:var(--good-ink)">${nf(PT.p100)}</b> selesai</span><span class="go">Rincian ›</span></span>
      ${sbar(PT, S.count)}
      <span class="pleg"><span><i class="s1"></i>100%</span><span><i class="s2"></i>&gt;50%</span><span><i class="s3"></i>&lt;50%</span><span><i class="s0"></i>belum</span><span>· per ${esc(PG.waktu.replace(/^[^,]+, /, ''))}</span></span>
    </button>
    <h2>Status identitas (NIK & KK)</h2>
    <div class="stat3">
      <button data-vf="valid">${badge('valid')}<span class="n">${nf(S.valid)}</span></button>
      <button data-vf="cek">${badge('cek')}<span class="n">${nf(S.cek)}</span></button>
      <button data-vf="invalid">${badge('invalid')}<span class="n">${nf(S.invalid)}</span></button>
    </div>
    <h2>Jumlah orang per kecamatan</h2>
    <ul class="klist">${kecs.map(k => {
      const ds = DESA.filter(d => d.kec_code === k.code && d.count > 0).sort((a, b) => b.count - a.count);
      const open = state.openKec === k.code;
      return `<li>
        <button class="krow" data-kec="${k.code}" aria-expanded="${open}">
          <span class="kname"><span class="chev" aria-hidden="true">›</span>${esc(k.name)}</span>
          <span class="kcount">${nf(k.count)} <small>orang</small></span>
          <span class="kbar"><span class="track"><span style="width:${(k.count / max * 100).toFixed(1)}%"></span></span></span>
          <span class="kmeta">${ds.length} desa/kel. berisi data · L ${k.L} · P ${k.P} · progres ${nf(ptot(progByKec.get(k.code)))} unit
            ${k.invalid ? badge('invalid', k.invalid + ' tidak valid') : ''}${k.cek ? badge('cek', k.cek + ' perlu dicek') : ''}</span>
        </button>
        ${open ? `<ul class="dsub">${ds.map(d => `<li><button data-desa="${d.code}">
            <span class="dn">${esc(d.name)}<small>${d.jenis}</small></span>
            <span class="dc">${d.invalid ? icon('invalid') : ''}${d.cek ? icon('cek') : ''}${nf(d.count)}</span></button></li>`).join('')}</ul>` : ''}
      </li>`;
    }).join('')}</ul>
    <p class="note">Ketuk kecamatan untuk memperbesar peta dan melihat rincian desa/kelurahan.</p>`;
}

/* ================= panel: progres ================= */
function renderProgres(){
  const N = S.count, tot = ptot(PT);
  const kecs = [...PG.kec].sort((a, b) => ptot(b) - ptot(a));
  $('#tab-progres').innerHTML = `
    <p class="lead">Progres pembangunan Huntara per ${esc(PG.waktu)}. Sumber: ${esc(PG.sumber)}.</p>
    <div class="kpis">
      <div class="kpi"><div class="kv">${nf(tot)}</div><div class="kl">unit masuk progres <small>dari ${nf(N)} (${pct(tot, N)}%)</small></div></div>
      <div class="kpi"><div class="kv" style="color:var(--good-ink)">${nf(PT.p100)}</div><div class="kl">unit selesai 100%</div></div>
      <div class="kpi"><div class="kv">${nf(N - tot)}</div><div class="kl">belum ada progres</div></div>
    </div>
    ${sbar(PT, N, true)}
    <div class="pleg"><span><i class="s1"></i>100% (${nf(PT.p100)})</span><span><i class="s2"></i>&gt;50% (${nf(PT.p50)})</span><span><i class="s3"></i>&lt;50% (${nf(PT.plt50)})</span><span><i class="s0"></i>belum (${nf(N - tot)})</span></div>
    <h2>Per kecamatan</h2>
    <ul class="klist">${kecs.map(k => `<li><button class="krow" data-pkec="${k.code}">
        <span class="kname">${esc(k.name)}</span>
        <span class="kcount">${nf(ptot(k))} <small>/ ${nf(k.penerima)} unit masuk progres</small></span>
        <span class="kbar">${sbar(k, k.penerima)}</span>
        <span class="kmeta pm">${pmeta(k, k.penerima)}</span>
        ${k.alokasi < k.penerima ? `<span class="kmeta">${badge('cek', nf(k.penerima - k.alokasi) + ' unit belum ada penyedia')}</span>` : ''}
      </button></li>`).join('')}</ul>
    <p class="note">Pembanding = jumlah penerima (SK 389 + SK 421) di kecamatan tsb. Ketuk kecamatan untuk melihat di peta.</p>
    <h2>Per penyedia</h2>
    <ul class="klist">${PG.penyedia.map(p => `<li><div class="krow static">
        <span class="kname">${esc(p.nama)}</span>
        <span class="kcount">${nf(ptot(p))} <small>/ ${nf(p.unit)} unit masuk progres</small></span>
        <span class="kbar">${sbar(p, p.unit)}</span>
        <span class="kmeta"><span>Lokasi: ${p.lokasi.map(([n, u]) => `${esc(n)} (${u})`).join(', ')}</span></span>
        <span class="kmeta pm">${pmeta(p, p.unit)}</span>
      </div></li>`).join('')}
      <li><div class="krow static">
        <span class="kname">Huntara mandiri / swadaya</span>
        <span class="kcount">${nf(ptot(PG.mandiri))} <small>unit</small></span>
        <span class="kmeta pm">${pmeta(PG.mandiri)}</span>
      </div></li>
    </ul>
    <h2>Catatan data</h2>
    <ul class="plist">${PG.catatan.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`;
}

/* ================= panel: validasi ================= */
function renderValidasi(){
  const sets = {
    issues: issues, invalid: ROWS.filter(r => r.st === 'invalid'), cek: ROWS.filter(r => r.st === 'cek'),
    info: ROWS.filter(hasInfo),
  };
  const labels = {issues:'Semua bermasalah', invalid:'Tidak valid', cek:'Perlu dicek', info:'Info asal NIK'};
  const list = [...sets[state.vf]].sort((a, b) => ORDER[a.st] - ORDER[b.st] || a.no - b.no);
  const kecRows = KEC.map(k => `<li><b>5316${k.code.slice(-2)}</b> = Kec. ${esc(k.name)}</li>`).join('');
  $('#tab-validasi').innerHTML = `
    <p class="lead">Setiap NIK dan No. KK diperiksa strukturnya (kode wilayah, tanggal, nomor urut) dan kecocokannya dengan alamat. Pemeriksaan ini <b>tidak</b> mencocokkan ke database Dukcapil, jadi NIK yang lolos belum tentu terdaftar.</p>
    <p class="note">Semua penerima sudah ditetapkan dalam lampiran ${esc(SRC.bnba.short)} dan ${esc(SRC.sk.short)}, dan NIK/No. KK di lampiran sama dengan data ini. Jadi ${nf(ROWS.filter(r => r.st !== 'valid').length)} data yang bermasalah juga perlu diralat di lampiran SK bila dikoreksi.</p>
    <details class="rules">
      <summary>Cara membaca NIK & No. KK</summary>
      <p><b>NIK</b> (16 digit), contoh:</p>
      <div class="diag">
        <div><b>53</b><span>Provinsi<br>(NTT)</span></div><div><b>16</b><span>Kabupaten<br>(Nagekeo)</span></div>
        <div><b>01</b><span>Kecamatan</span></div><div><b>050761</b><span>Tgl lahir<br>DDMMYY</span></div><div><b>0003</b><span>No. urut</span></div>
      </div>

}

(function sheetGestures(){
  const order = ['min', 'half', 'full'];
  let y0 = null, moved = false;
  const start = e => { y0 = (e.touches ? e.touches[0] : e).clientY; moved = false; };
  const end = e => {
    if (y0 == null) return;
    const y = (e.changedTouches ? e.changedTouches[0] : e).clientY, dy = y - y0; y0 = null;
    const i = order.indexOf(state.sheet);
    if (dy < -30) { moved = true; setSheet(order[Math.min(2, i + 1)]); }
    else if (dy > 30) { moved = true; setSheet(order[Math.max(0, i - 1)]); }
  };
  [$('#handle'), $('#phead')].forEach(el => {
    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchend', end);
  });
  $('#handle').addEventListener('click', () => {
    if (moved) { moved = false; return; }
    setSheet(state.sheet === 'half' ? 'full' : 'half');
  });
})();

/* ================= map ================= */
const map = L.map('map', {zoomControl:false, minZoom:6, maxZoom:18, zoomSnap:0.5,
  maxBounds:[[-13.5, 115.5], [-5.5, 128]], maxBoundsViscosity:0.7, tap:true});
map.attributionControl.setPrefix(false);

['ntt:380', 'kecfill:400', 'desafill:410', 'lines:420'].forEach(p => {

});
map.getPane('lines').style.pointerEvents = 'none';
map.getPane('shadowPane').style.zIndex = 450; map.getPane('shadowPane').style.pointerEvents = 'none';

const BW = ' · Batas: <a href="https://github.com/cahyadsn/wilayah_boundaries" target="_blank" rel="noopener">Kemendagri</a>';
const esri = (svc, o) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/{z}/{y}/{x}`, Object.assign({maxZoom:19}, o));
const tiles = {
  light: L.layerGroup([esri('Canvas/World_Light_Gray_Base', {maxNativeZoom:16, attribution:'&copy; Esri, HERE, Garmin, OSM' + BW}),
                       esri('Canvas/World_Light_Gray_Reference', {maxNativeZoom:16, pane:'shadowPane'})]),
  dark:  L.layerGroup([esri('Canvas/World_Dark_Gray_Base', {maxNativeZoom:16, attribution:'&copy; Esri, HERE, Garmin, OSM' + BW}),
                       esri('Canvas/World_Dark_Gray_Reference', {maxNativeZoom:16, pane:'shadowPane'})]),
  jalan: esri('World_Street_Map', {maxNativeZoom:18, attribution:'&copy; Esri, HERE, Garmin, OSM' + BW}),
  sat:   L.layerGroup([esri('World_Imagery', {maxNativeZoom:18, attribution:'Citra &copy; Esri, Maxar' + BW}),
                       esri('Reference/World_Boundaries_and_Places', {maxNativeZoom:18, pane:'shadowPane'})]),
};
let curTile = null;

const BINS = {
  kec:  [[1,10,'1–10'], [11,25,'11–25'], [26,40,'26–40'], [41,60,'41–60'], [61,1e9,'61+']],
  desa: [[1,1,'1'], [2,3,'2–3'], [4,6,'4–6'], [7,12,'7–12'], [13,1e9,'13+']],
};
const RAMP = {light:['#b7d3f6','#86b6ef','#3987e5','#1c5cab','#0d366b'], dark:['#104281','#1c5cab','#3987e5','#86b6ef','#cde2fb']};
const ramp = () => RAMP[isDark() ? 'dark' : 'light'];
const binOf = (n, lv) => n ? BINS[lv].findIndex(([a, b]) => n >= a && n <= b) : -1;
const lineCol = () => state.base === 'sat' ? '#ffffff' : (isDark() && state.base === 'peta' ? '#c3c2b7' : '#3a3936');
const accent = () => isDark() ? '#3987e5' : '#2a78d6';

function kecStyle(f){
  const k = kecByCode.get(f.properties.code), b = binOf(k.count, 'kec');
  return {color:lineCol(), weight:1, opacity:.6, fillColor:b < 0 ? '#888' : ramp()[b], fillOpacity:b < 0 ? .05 : (state.base === 'peta' ? .7 : .55)};
}
function desaStyle(f){
  const d = desaByCode.get(f.properties.code), b = binOf(d.count, 'desa'), sel = state.sel === d.code;
  return {color:sel ? accent() : lineCol(), weight:sel ? 3.5 : .8, opacity:sel ? 1 : .55, dashArray:b < 0 && !sel ? '3 3' : null,
    fillColor:b < 0 ? '#888' : ramp()[b], fillOpacity:b < 0 ? .04 : (state.base === 'peta' ? .72 : .55)};
}
const lineStyle = () => ({color:lineCol(), weight:2.2, opacity:.85, fill:false});
const kabStyle = () => ({color:state.base === 'sat' ? '#ffffff' : (isDark() && state.base === 'peta' ? '#ffffff' : '#0b0b0b'), weight:3.2, opacity:.9, fill:false});
const nttStyle = () => ({color:state.base === 'sat' ? '#ffffff' : '#898781', weight:1, opacity:.8, fillColor:'#898781', fillOpacity:.04});

const feat = (o, props) => ({type:'Feature', geometry:o.geom, properties:props});
const FC = features => ({type:'FeatureCollection', features});

const nttLayer = L.geoJSON(FC(D.ntt.map(k => feat(k, {name:k.name}))), {pane:'ntt', style:nttStyle,
  onEachFeature:(f, l) => l.bindTooltip(esc(f.properties.name), {sticky:true, className:'tip', direction:'top'})}).addTo(map);

const kecLayers = new Map();
const kecFill = L.geoJSON(FC(KEC.map(k => feat(k, {code:k.code}))), {pane:'kecfill', style:kecStyle,
  onEachFeature:(f, l) => {
    const k = kecByCode.get(f.properties.code);
    kecLayers.set(k.code, l);
    const pg = progByKec.get(k.code);
    if (canHover) l.bindTooltip(`<b>Kec. ${esc(k.name)}</b><br>${nf(k.count)} orang · klik untuk rincian desa<br>Progres huntara: ${nf(ptot(pg))} unit (${nf(pg.p100)} selesai)`, {sticky:true, className:'tip'});
    l.on('click', () => zoomToKec(k.code));
    l.on('mouseover', () => l.setStyle({weight:3, color:accent(), opacity:1}));
    l.on('mouseout', () => kecFill.resetStyle(l));
  }});

const desaLayers = new Map();
const desaFill = L.geoJSON(FC(DESA.map(d => feat(d, {code:d.code}))), {pane:'desafill', style:desaStyle,
  onEachFeature:(f, l) => {
    const d = desaByCode.get(f.properties.code);
    desaLayers.set(d.code, l);
    if (canHover) l.bindTooltip(`<b>${esc(d.name)}</b> <span style="color:var(--ink2)">${d.jenis}, Kec. ${esc(d.kec)}</span><br>${nf(d.count)} orang`, {sticky:true, className:'tip'});
    l.on('click', e => openDesaPopup(d.code, e.latlng));
    l.on('mouseover', () => { if (state.sel !== d.code) l.setStyle({weight:2.5, color:accent(), opacity:1, dashArray:null}); });
    l.on('mouseout', () => l.setStyle(desaStyle(f)));
  }});

const kecLines = L.geoJSON(FC(KEC.map(k => feat(k, {code:k.code}))), {pane:'lines', interactive:false, style:lineStyle}).addTo(map);
const kabLine = L.geoJSON(feat(D.kab, {}), {pane:'lines', interactive:false, style:kabStyle}).addTo(map);

const kecLabels = L.layerGroup(KEC.map(k => L.marker(k.center, {keyboard:false, icon:L.divIcon({className:'lbl', iconSize:[0,0],
  html:`<div class="klabel" title="Kec. ${esc(k.name)}: ${k.count} orang">${esc(k.name)}<b>${nf(k.count)}</b></div>`})})
  .on('click', () => zoomToKec(k.code))));

const desaMarkers = new Map();
const desaMarks = L.layerGroup(DESA.filter(d => d.count > 0).map(d => {
  const size = d.count >= 10 ? 34 : d.count >= 4 ? 28 : 24;
  const flag = d.invalid ? '<span class="flag" title="Ada data tidak valid">✕</span>' : d.cek ? '<span class="flag warn" title="Ada data perlu dicek">!</span>' : '';
  const m = L.marker(d.center, {keyboard:false, riseOnHover:true, icon:L.divIcon({className:'lbl', iconSize:[0,0],
    html:`<div class="cnt" style="--d:${size}px" title="${esc(d.name)}: ${d.count} orang">${d.count}${flag}<span class="dname">${esc(d.name)}</span></div>`})})
    .on('click', () => openDesaPopup(d.code));
  desaMarkers.set(d.code, m);

}));

/* ----- controls ----- */

function renderLegend(){

/* ----- behaviour ----- */
function applyBase(){
  const t = state.base === 'sat' ? tiles.sat : state.base === 'jalan' ? tiles.jalan : (isDark() ? tiles.dark : tiles.light);
  if (curTile !== t) { if (curTile) map.removeLayer(curTile); t.addTo(map); curTile = t; }
  $$('#baseSeg button').forEach(b => b.classList.toggle('on', b.dataset.base === state.base));
  restyle();
}
function restyle(){
  nttLayer.setStyle(nttStyle); kecFill.setStyle(kecStyle); desaFill.setStyle(desaStyle);
  kecLines.setStyle(lineStyle); kabLine.setStyle(kabStyle);
  if (state.level) renderLegend();
}
function setLevel(lv){
  if (state.level === lv) return;
  state.level = lv;
  if (lv === 'kec') { map.addLayer(kecFill); map.addLayer(kecLabels); map.removeLayer(desaFill); map.removeLayer(desaMarks); }
  else { map.removeLayer(kecFill); map.removeLayer(kecLabels); map.addLayer(desaFill); map.addLayer(desaMarks); }
  $$('#levelSeg button').forEach(b => { b.classList.toggle('on', b.dataset.level === lv); b.setAttribute('aria-pressed', b.dataset.level === lv); });
  renderLegend();
}
function fitNagekeo(){ map.fitBounds(kabLine.getBounds(), {padding:[16,16]}); }
function selectDesa(code){
  const prev = state.sel; state.sel = code;
  [prev, code].forEach(c => { if (c && desaLayers.get(c)) desaLayers.get(c).setStyle(desaStyle({properties:{code:c}})); });
  if (prev && desaMarkers.get(prev)) { const el = desaMarkers.get(prev).getElement(); el && el.querySelector('.cnt').classList.remove('sel'); }
  if (code && desaMarkers.get(code)) { const el = desaMarkers.get(code).getElement(); el && el.querySelector('.cnt').classList.add('sel'); }
}
function whenMapReady(fn){
  if (mqMobile.matches && state.sheet === 'full') { setSheet('half'); setTimeout(fn, 320); } else fn();
}
function zoomToKec(code){
  state.openKec = code;
  if (state.tab === 'ringkasan') renderRingkasan();
  whenMapReady(() => {
    map.closePopup();
    setLevel('desa');
    map.fitBounds(kecLayers.get(code).getBounds(), {padding:[20,20]});
  });
}
function focusDesa(code){
  whenMapReady(() => {
    setLevel('desa');
    selectDesa(code);
    let done = false;
    const open = () => { if (!done) { done = true; openDesaPopup(code); } };
    map.once('moveend', open); setTimeout(open, 900);
    map.fitBounds(desaLayers.get(code).getBounds(), {maxZoom:14, padding:[40,40]});
  });
}
function openDesaPopup(code, latlng){
  const d = desaByCode.get(code), rows = [...(byDesa.get(code) || [])].sort((a, b) => ORDER[a.st] - ORDER[b.st] || a.nama.localeCompare(b.nama));
  const html = `<div class="pop">
    <div class="pk">${d.jenis} · Kec. ${esc(d.kec)}</div>
    <div class="pt">${esc(d.name)}</div>
    <div class="pn"><b>${nf(d.count)}</b> orang${d.count ? ` · L ${d.L} · P ${d.P}` : ''}</div>
    ${d.count ? `<div class="pst">${badge('valid', d.valid + ' valid')}${d.cek ? badge('cek', d.cek + ' perlu dicek') : ''}${d.invalid ? badge('invalid', d.invalid + ' tidak valid') : ''}</div>
      <ul>${rows.map(r => `<li><button data-no="${r.no}">${icon(r.st)}<span>${esc(r.nama)}</span>${srcTag(r)}</button></li>`).join('')}</ul>
      <div class="hint">Ketuk nama untuk detail NIK/KK.</div>`
      : '<p class="pe">Tidak ada penerima dari desa/kelurahan ini di SK 389 maupun SK 421.</p>'}
  </div>`;
  L.popup({maxWidth:300, minWidth:230, autoPanPaddingTopLeft:[60, 60], autoPanPaddingBottomRight:[20, 20]})
    .setLatLng(latlng || d.center).setContent(html).openOn(map);
  selectDesa(code);
}
map.on('popupclose', () => selectDesa(null));
map.on('zoomend', () => {
  const z = map.getZoom();
  map.getContainer().classList.toggle('z-lo', z < 12);
  map.getContainer().classList.toggle('z-xs', z < 10.5);
  if (z >= 12 && state.level === 'kec') setLevel('desa');
  if (z <= 8.5 && state.level === 'desa') setLevel('kec');
});

function closeModal(){ if ($('#modal').hidden) return; $('#modal').hidden = true; if (lastFocus) lastFocus.focus(); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ================= delegated clicks ================= */
function onClick(e){
  const t = e.target;
  let b;
  if ((b = t.closest('[data-close]'))) return closeModal();
  if ((b = t.closest('[data-map]'))) { closeModal(); return focusDesa(b.dataset.map); }
  if ((b = t.closest('[data-no]'))) return openDetail(+b.dataset.no);
  if ((b = t.closest('[data-desa]'))) return focusDesa(b.dataset.desa);
  if ((b = t.closest('[data-tab]'))) return setTab(b.dataset.tab);
  if ((b = t.closest('[data-pkec]'))) return zoomToKec(b.dataset.pkec);
  if ((b = t.closest('[data-kec]'))) {
    const c = b.dataset.kec;
    if (state.openKec === c) { state.openKec = null; renderRingkasan(); return; }
    return zoomToKec(c);
  }
  if ((b = t.closest('[data-vf]'))) { state.vf = b.dataset.vf === 'valid' ? 'issues' : b.dataset.vf; renderValidasi(); if (b.dataset.vf === 'valid') { $('#fst').value = 'valid'; renderData(); setTab('data'); } else setTab('validasi'); return; }
  if ((b = t.closest('[data-vchip]'))) { state.vf = b.dataset.vchip; renderValidasi(); return; }
}
document.addEventListener('click', onClick);
// Leaflet stops click propagation out of popups, so listen on the popup itself
map.on('popupopen', e => e.popup.getElement().addEventListener('click', onClick));
$('#maskBtn').addEventListener('click', () => {
  state.masked = !state.masked;
  $('#maskBtn').setAttribute('aria-pressed', state.masked);
  $('#maskBtn').textContent = state.masked ? 'NIK disamarkan' : 'Samarkan NIK';
  renderValidasi(); renderData();
  if (!$('#modal').hidden) { const no = +$('#mcard .mk').textContent.match(/\d+/)[0]; openDetail(no); }
});

mqDark.addEventListener && mqDark.addEventListener('change', applyBase);
mqMobile.addEventListener && mqMobile.addEventListener('change', () => setTimeout(() => map.invalidateSize(), 50));

/* ================= init ================= */
document.body.dataset.sheet = state.sheet;
renderRingkasan(); renderProgres(); renderValidasi(); renderData();
{ const h = location.hash.slice(1); if (['progres', 'validasi', 'data'].includes(h)) setTab(h); }
setLevel('kec');
applyBase();
fitNagekeo();
map.fire('zoomend');
})();
</script>
</body>
